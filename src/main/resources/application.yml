spring:
  application:
    name: webhook-alerts

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uptime_db}
    username: ${DB_USER:uptime_user}
    password: ${DB_PASSWORD:uptime_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  monitor:
    scheduler-enabled: true
    fixed-delay-ms: 10000
    batch-size: 50
    failure-threshold: 2
  webhook:
    max-attempts: 5
    timeout-ms: 5000
    jitter-factor: 0.15
    retry-delays-ms: [60000, 120000, 240000, 480000]